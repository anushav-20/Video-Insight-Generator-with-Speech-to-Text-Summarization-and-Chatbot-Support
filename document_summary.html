{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="dashboard-card">
                <h3 class="text-center mb-4">
                    <i class="fas fa-file-alt me-2"></i>Document Summarization
                </h3>
                
                <!-- Upload Form -->
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Upload Document</h5>
                        <form method="POST" enctype="multipart/form-data">
                            <div class="mb-3">
                                <input type="file" class="form-control" name="document" accept=".pdf,.doc,.docx,.wav,.mp3" required>
                                <div class="form-text">
                                    Supported formats: PDF, DOC, DOCX, WAV, MP3
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-upload me-2"></i>Process Document
                            </button>
                        </form>
                    </div>
                </div>
                
                <!-- Results -->
                {% if extracted_text %}
                <div class="row">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h6>Extracted Text</h6>
                            </div>
                            <div class="card-body" style="max-height: 300px; overflow-y: auto;">
                                {{ extracted_text }}
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h6>AI Summary</h6>
                            </div>
                            <div class="card-body">
                                {{ summary }}
                            </div>
                        </div>
                    </div>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
