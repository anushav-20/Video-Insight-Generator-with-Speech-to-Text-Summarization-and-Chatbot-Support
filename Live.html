{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-12">
            <div class="dashboard-card">
                <h2 class="fw-bold mb-4" style="color: var(--primary-orange);">
                    <i class="fas fa-camera me-2"></i>Live Object Detection
                </h2>
                <p class="lead">Real-time object detection from your webcam feed</p>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="feature-card">
                <form method="POST" action="/detectlive">
                    <div class="mb-4">
                        <label class="form-label fw-bold">Objects to Detect</label>
                        <input type="text" class="form-control" name="query" placeholder="e.g., person, car, dog" required>
                        <div class="form-text">Enter comma-separated objects for real-time detection</div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-play me-2"></i>Start Live Detection
                    </button>
                </form>
            </div>

            {% if outputvideo %}
            <div class="feature-card mt-4">
                <h4 class="card-title mb-4">Live Detection Results</h4>
                <video controls class="w-100 rounded" style="max-height: 400px;">
                    <source src="{{ outputvideo }}" type="video/mp4">
                </video>
                <div class="mt-3">
                    <strong>Objects Detected:</strong> {{ query }}
                </div>
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
